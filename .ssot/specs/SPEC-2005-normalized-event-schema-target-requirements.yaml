body: |-
  ## Purpose
  
  Define pack-local requirements for normalized event schema and event format targets.
  
  ## Requirements
  
  - Elastic Common Schema coverage must govern normalized event fields and common schema reference expectations.
  - OCSF coverage must govern event classes, categories, severities, activities, actors, devices, and observable field semantics.
  - Splunk CIM coverage must govern normalized search-time fields, tags, and data model expectations.
  - LEEF coverage must govern QRadar event format structure, headers, delimiters, and key-value attributes.
  - CEF coverage must govern ArcSight event format structure, fixed headers, extension fields, escaping, and severity mapping.
  - These targets must be classified as normalized schema or event format targets, not primary customer analytics collection APIs.
  
  ## Evidence Expectations
  
  - Target inventory for ECS, OCSF, Splunk CIM, LEEF, and CEF.
  - Template review showing one downstream conformance target per normalized schema or event format.
