body: |-
  ## Purpose
  
  Define pack-local requirements for event envelope and telemetry data-model targets.
  
  ## Requirements
  
  - CloudEvents targets must distinguish core attributes, HTTP binding behavior, and JSON event format behavior.
  - OpenTelemetry targets must distinguish the general specification, logs data model, semantic conventions for events, browser semantic conventions, and general semantic conventions.
  - Envelope metadata, transport binding, serialization format, semantic convention, and payload schema requirements must not be collapsed into one target.
  - Downstream templates must identify whether they validate event envelope fields, HTTP transport behavior, JSON serialization, telemetry record fields, or semantic attributes.
  
  ## Evidence Expectations
  
  - Target list proving separate coverage for CloudEvents core, CloudEvents HTTP binding, CloudEvents JSON format, OpenTelemetry event/log model, and OpenTelemetry browser semantics.
  - Template review showing that envelope and semantic requirements are separate.
