body: |-
  ## Context
  
  Browser and web application telemetry often starts from platform events before it becomes product analytics, conversion measurement, or observability telemetry.
  
  ## Decision
  
  This pack includes browser interaction event authorities when they define raw platform event semantics used as behavioral telemetry inputs. The included web interaction authorities are WHATWG DOM Events, W3C UI Events, W3C Pointer Events, and W3C Input Events.
  
  The pack does not govern vendor analytics event naming, campaign attribution, page performance metrics, or downstream behavioral product analytics schemas through this boundary.
  
  ## Authority Sources
  
  - WHATWG DOM Standard event model.
  - W3C UI Events.
  - W3C Pointer Events.
  - W3C Input Events.
